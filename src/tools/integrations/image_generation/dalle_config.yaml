# DALL-E 3 Tool Configuration
# Configuration for OpenAI DALL-E 3 integration

tool:
  name: "dalle_image_generator"
  description: "Generate high-quality images using OpenAI's DALL-E 3 model"
  version: "1.0.0"
  category: "image_generation"
  enabled: true

# API Configuration
api:
  base_url: "https://api.openai.com/v1/images/generations"
  model: "dall-e-3"
  timeout_seconds: 120
  max_retries: 3
  retry_delay: 2.0

# Rate Limiting
rate_limits:
  requests_per_minute: 50
  requests_per_hour: 1000
  requests_per_day: 5000
  concurrent_requests: 5

# Image Generation Limits
generation:
  max_prompt_length: 4000
  max_images_per_request: 10  # DALL-E 3 actually limits to 1, but we allow batch requests
  supported_sizes:
    - "1024x1024"
    - "1024x1792"
    - "1792x1024"
  supported_qualities:
    - "standard"
    - "hd"
  supported_styles:
    - "vivid"
    - "natural"
  response_formats:
    - "url"
    - "b64_json"
  default_size: "1024x1024"
  default_quality: "standard"
  default_style: "vivid"
  default_format: "b64_json"

# File Management
storage:
  base_directory: "./generated_images"
  organize_by_tenant: true
  organize_by_date: true
  create_metadata: true
  auto_cleanup: false
  max_storage_gb: 10
  allowed_formats: ["png", "jpg", "jpeg"]
  default_format: "png"

# Content Filtering and Safety
safety:
  content_policy_enforcement: true
  prompt_filtering: true
  output_validation: true
  prohibited_content_detection: true
  content_moderation_api: true

# Monitoring and Logging
monitoring:
  track_usage: true
  log_prompts: true
  log_responses: true
  performance_metrics: true
  cost_tracking: true
  error_tracking: true

# Multi-tenant Configuration
multi_tenant:
  enabled: true
  tenant_isolation: true
  per_tenant_limits: true
  tenant_specific_storage: true
  tenant_usage_tracking: true

# Cost Management
cost_management:
  budget_alerts: true
  usage_limits: true
  cost_per_image_tracking: true
  monthly_budget_limit: 1000  # USD
  alert_thresholds:
    - 50   # 50% of budget
    - 75   # 75% of budget
    - 90   # 90% of budget

# Integration Settings
integration:
  webhook_notifications: false
  external_storage_sync: false
  cdn_upload: false
  image_optimization: true
  metadata_extraction: true

# Development and Testing
development:
  mock_responses: false
  test_mode: false
  debug_logging: false
  save_raw_responses: false

# Environment Specific Overrides
environments:
  development:
    rate_limits:
      requests_per_minute: 10
      requests_per_hour: 100
    storage:
      base_directory: "./dev_generated_images"
    monitoring:
      debug_logging: true
  
  staging:
    rate_limits:
      requests_per_minute: 30
      requests_per_hour: 500
    storage:
      base_directory: "./staging_generated_images"
  
  production:
    rate_limits:
      requests_per_minute: 50
      requests_per_hour: 1000
    storage:
      base_directory: "/var/lib/varga-ai/generated_images"
    monitoring:
      performance_metrics: true
      cost_tracking: true