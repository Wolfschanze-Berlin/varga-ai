# Exercise Generator Configuration
exercises:
  content_database: "agents/data/exercise_content.json"
  
  generation_rules:
    variety_factor: 0.8  # How much to vary exercise types in a set
    difficulty_adaptation: true
    personalization: true
    
  exercise_types:
    vocabulary_match:
      display_name: "Vocabulary Matching"
      description: "Match words with their meanings"
      base_points: 1
      estimated_minutes: 1
      
    grammar_fill:
      display_name: "Grammar Fill-in"
      description: "Complete sentences with correct grammar"
      base_points: 2
      estimated_minutes: 2
      
    sentence_order:
      display_name: "Sentence Building"
      description: "Arrange words in correct order"
      base_points: 2
      estimated_minutes: 2
      
    translation:
      display_name: "Translation"
      description: "Translate phrases between languages"
      base_points: 3
      estimated_minutes: 3
      
    reading_comprehension:
      display_name: "Reading Comprehension"
      description: "Answer questions about text passages"
      base_points: 3
      estimated_minutes: 4
      
    word_association:
      display_name: "Word Association"
      description: "Connect related words and concepts"
      base_points: 1
      estimated_minutes: 1
      
    synonym_antonym:
      display_name: "Synonyms & Antonyms"
      description: "Find words with similar or opposite meanings"
      base_points: 2
      estimated_minutes: 2

# Bot Interface Configuration
bot:
  command_prefix: "/"
  
  commands:
    start:
      description: "Start or restart the language learning bot"
      aliases: ["begin", "restart"]
      
    help:
      description: "Show available commands and help information"
      aliases: ["h", "info"]
      
    language:
      description: "Select or change your learning language"
      aliases: ["lang", "languages"]
      
    conversation:
      description: "Start conversation practice mode"
      aliases: ["chat", "talk", "practice"]
      
    homework:
      description: "Start homework and exercises mode"
      aliases: ["exercise", "exercises", "hw"]
      
    progress:
      description: "View your learning progress and statistics"
      aliases: ["stats", "status", "report"]
      
    achievements:
      description: "View your unlocked achievements and badges"
      aliases: ["badges", "awards", "trophies"]
      
    streak:
      description: "Check your learning streak information"
      aliases: ["fire", "chain"]
      
    settings:
      description: "Adjust your learning preferences and goals"
      aliases: ["config", "preferences"]
  
  messages:
    welcome: |
      🌟 **Welcome to Language Learning Bot!** 🌟

      Hello! I'm your personal language teacher, ready to help you learn a new language or improve your skills.

      **What I can help you with:**
      📚 Interactive conversations in your target language
      ✍️ Homework assignments and exercises  
      📈 Track your progress and achievements
      🏆 Daily streaks and motivation
      🎯 Personalized learning paths

      **Let's get started!**
      Please choose the language you'd like to learn.
      
    help: |
      🤖 **Language Learning Bot Help**

      **Main Commands:**
      • /start - Start or restart the bot
      • /language - Select or change language
      • /conversation - Switch to conversation practice
      • /homework - Switch to homework mode
      • /progress - View your learning progress
      • /achievements - See unlocked achievements
      • /streak - Check your learning streak
      • /settings - Adjust your preferences
      • /help - Show this help message

      **How to Use:**
      1️⃣ Choose your target language
      2️⃣ Set your current level
      3️⃣ Start learning with conversations or exercises
      4️⃣ Track progress and unlock achievements!

      **Tips:**
      💡 Practice daily to maintain your streak
      💡 Mix conversation and homework for balanced learning
      💡 Don't worry about mistakes - they help you learn!

      Need more help? Just ask me anything! 😊
      
    error: |
      Sorry, I encountered an error processing your request. 
      Please try again or use /help for assistance.
      
    maintenance: |
      🔧 I'm currently undergoing maintenance. 
      Please try again in a few minutes. Thank you for your patience!

# Database Configuration
database:
  connection_timeout: 30
  retry_attempts: 3
  backup_enabled: true
  backup_interval_hours: 24
  cleanup_old_data_days: 365

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  file_path: "logs/language_teacher.log"
  max_file_size_mb: 10
  backup_count: 5

# Performance Configuration
performance:
  cache_enabled: true
  cache_ttl_minutes: 10
  max_concurrent_users: 1000
  rate_limit_per_minute: 30
  response_timeout_seconds: 30
  
# Feature Flags
features:
  voice_messages: false  # Future feature
  image_exercises: false  # Future feature
  group_learning: false  # Future feature
  live_tutoring: false   # Future feature
  premium_features: false # Future feature
  analytics: true
  notifications: true
  reminders: true

# Monitoring and Analytics
monitoring:
  enabled: true
  metrics_collection: true
  error_tracking: true
  performance_monitoring: true
  user_analytics: true  # Anonymized